<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Rafting Company </title>
    <meta name="description"
      content="Get in touch with White Water Rafting Company for inquiries, help and travelling information.">
    <meta name="author" content="Nicole Matanga">

    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Rafting Company logo">

        <nav>
            <ul class=" navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <main>

        <section class="company-header">
            <h1>White Water Rafting Company</h1>
            <div class="address-details">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>
        </section>

        <div class="company-info">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064bf5f2fd1%3A0x2a11bfa03e8321d3!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1610000000000!5m2!1sen!2sus"
                  width="600" height="400" allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-row">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-row radio-group">
                    <label class="group-title">Message Purpose</label>
                    <div class="radio-options">
                        <label><input type="radio" id="general" name="purpose" value="general"
                              checked>
                            General Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"
                              value="reservation">
                            Reservation Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"
                      rows="4"></textarea>
                </div>

                <div class="form-row checkbox-row">
                    <label>
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
            </>

            <section class="employees">
                <h2>We Are Here to Serve You</h2>
                <div class="employee-grid">
                    <figure>
                        <img src="images/employee1.jpg" alt="Profile of Employee 1">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee2.jpg" alt="Profile of Employee 2">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee3.jpg" alt="Profile of Employee 3">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                </div>
            </section>
    </main>

    <footer>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg.png"
                  alt="Facebook Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg.png"
                  alt="Instagram Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg.png"
                  alt="Linkedin icon"></a>
        </nav>
        <p>© 2026 Rafting Company | Nicole Matanga </p>
    </footer>
</body>

</html>
